<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEAEK | 바다 표류 예측</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"><link rel="stylesheet" href="style.css"></head><body><header><a href="#top">🌊 SEAEK</a><span>바다 위 분실물 표류 예측</span></header><main id="top"><section class="hero"><p>SMART OCEAN</p><h1>바다에 떠 있는 물건,<br><b>어디로 흘러갈까요?</b></h1><small>시연용 예상 결과입니다. 실제 구조 판단에는 사용할 수 없습니다.</small></section><section><h2>1. 분실 위치와 물체 정보</h2><div id="input-map"></div><p id="location">지도를 눌러 바다 위 분실 위치를 선택하세요.</p><form id="form"><div class="grid"><label>물체 종류<select id="item"><option>휴대전화</option><option>지갑</option><option>가방</option><option>물놀이 용품</option><option>기타</option></select></label><label>추정 무게 (kg)<input id="weight" type="number" min="0.05" max="100" step="0.05" value="0.3" required></label><label>물에 뜨나요?<select id="floating"><option value="yes">예, 물에 뜸</option><option value="no">아니요, 가라앉음</option></select></label><label>분실 시각<input id="time" type="datetime-local" required></label></div><button>실시간 바다 환경으로 예측하기</button></form></section><section id="result" hidden><h2>2. 예상 표류 경로</h2><p id="summary"></p><div id="result-map"></div><div class="cards"><article><small>풍향 · 풍속</small><strong id="wind">-</strong></article><article><small>해류</small><strong id="current">-</strong></article><article><small>파고</small><strong id="wave">-</strong></article></div><p class="note">출처: Open‑Meteo 실시간 기상·해양 모델. 육지 충돌과 건물 영향은 계산하지 않습니다.</p></section></main><footer>SEAEK · 고등학생 해양 안전 프로젝트</footer><script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script><script src="script.js"></script></body></html>
